name: Bug report
description: Report unexpected behaviour in the DiffServ4NS ns-2 module
title: "[bug] "
labels: ["kind/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please fill in the fields below so we can reproduce and triage quickly.

        This repository holds the ns-2 lineage. For the ns-3 QoS substrate *Stratum*, please file at [stratum-ns3](https://github.com/digitalities/stratum-ns3/issues) instead.

        For security-impacting defects, please email `digitalities@gmail.com` rather than opening a public issue.
  - type: dropdown
    id: where
    attributes:
      label: Where is the defect?
      options:
        - "ns-2.35 port layer (src/ns-2.35/)"
        - "ns-2.29 original (src/ns-2.29/) - note: frozen, fixes land in the 2.35 layer"
        - "Example scenarios (examples/)"
        - "Build or patch scripts (scripts/)"
        - "Documentation (docs/, README)"
        - "ns-2 core (surfaced by this work)"
        - "Other (describe in the body)"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Which ns-2 version?
      options:
        - "ns-2.35"
        - "ns-2.29"
        - "Both"
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Example or scenario used
      description: "Which scenario shows the problem?"
      placeholder: "e.g., example-2-fullscale, or 'example-1 under WF2Qp'"
    validations:
      required: true
  - type: dropdown
    id: buildpath
    attributes:
      label: How did you build?
      options:
        - "Docker (scripts/build-ns2-allinone-*-docker.sh)"
        - "Direct host build (legacy path)"
        - "Other (describe in the body)"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Build environment
      description: "OS + compiler version + Docker version if applicable"
      placeholder: "macOS 14.5 (Apple Silicon), Docker 27.0, image ubuntu:18.04 + GCC 7"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ... \n2. ... \n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: "Paste relevant simulator output, trace excerpts, or build errors."
      render: shell
