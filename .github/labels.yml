# Label taxonomy for the DiffServ4NS ns-2 archive.
# Prefix-namespaced; consume via EndBug/label-sync or
# crazy-max/ghaction-github-labeler in a GitHub Action.

# === area/* — which part of the archive does this concern? ===
- name: "area/ns-2.29"
  color: "1d76db"
  description: "The 2001 original (frozen historical reference)"
- name: "area/ns-2.35"
  color: "5319e7"
  description: "The 2026 port layer"
- name: "area/examples"
  color: "0e8a16"
  description: "Scenario and example Tcl files"
- name: "area/build"
  color: "fbca04"
  description: "Docker build, patch scripts, toolchain support"
- name: "area/tooling"
  color: "c5def5"
  description: "Trace parsing, comparison, and analysis scripts"

# === kind/* — what kind of issue is this? ===
- name: "kind/bug"
  color: "d73a4a"
  description: "Unexpected behaviour or defect"
- name: "kind/feature"
  color: "a2eeef"
  description: "New capability request"
- name: "kind/docs"
  color: "0075ca"
  description: "Documentation: guides, README, code comments"
- name: "kind/show-and-tell"
  color: "76dba9"
  description: "Adoption report — used in a paper, project, or evaluation"
- name: "kind/adoption"
  color: "76dba9"
  description: "Paired with show-and-tell; tracks real-world usage signals"
- name: "kind/reproduction"
  color: "bfd4f2"
  description: "Reproduction report for a documented scenario result"
- name: "kind/regression"
  color: "b60205"
  description: "Behaviour worked previously; needs bisect"

# === status/* — workflow state ===
- name: "status/triage"
  color: "fef2c0"
  description: "Awaiting initial review"
- name: "status/in-progress"
  color: "fbca04"
  description: "Being worked on"
- name: "status/blocked"
  color: "e99695"
  description: "Cannot proceed without external input or unblock"
- name: "status/needs-info"
  color: "d4c5f9"
  description: "Awaiting reporter response"

# === priority/* — urgency ===
- name: "priority/critical"
  color: "b60205"
  description: "Blocks release or correctness"
- name: "priority/normal"
  color: "fbca04"
  description: "Standard backlog"
- name: "priority/low"
  color: "0e8a16"
  description: "Nice to have"

# === GitHub-special ===
- name: "good first issue"
  color: "7057ff"
  description: "Suitable for a first-time contributor"
- name: "help wanted"
  color: "008672"
  description: "Maintainer would value external help here"
